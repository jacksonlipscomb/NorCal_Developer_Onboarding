name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize production deploys. A running deploy finishes; a newer push queues
# behind it (older pending runs are superseded), so the newest commit wins and
# two pushes never upload to production at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Scope the Cloudflare deploy credentials to a protected GitHub environment.
    # The token/account ID are stored as *environment* secrets on `production`,
    # so they are only exposed to runs that reference this environment, and any
    # protection/approval rules on it gate the deploy.
    environment: production
    defaults:
      run:
        working-directory: onboarding-app
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          # Wrangler v4 requires Node >= 22; the deploy step shells out to it.
          node-version: 22
          cache: npm
          cache-dependency-path: onboarding-app/package-lock.json

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      # Re-run the full quality gates here so a direct push to main (which never
      # triggers PR CI) cannot reach production unverified. pages:deploy only
      # typechecks + builds; lint and test would otherwise be skipped.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The SPA reads these PUBLIC values at BUILD time (Vite inlines them). They come from
      # GitHub Actions *variables* (not secrets). Fail fast with a clear message if missing —
      # otherwise the build silently ships `undefined` Supabase config.
      - name: Require Vite Supabase build env
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          : "${VITE_SUPABASE_URL:?Set the VITE_SUPABASE_URL Actions variable (production Supabase URL)}"
          : "${VITE_SUPABASE_ANON_KEY:?Set the VITE_SUPABASE_ANON_KEY Actions variable (production anon key)}"

      # Tag the deployment with the exact commit SHA so the verification step can
      # assert *this* commit became production. npm forwards the `--` args to the end
      # of the script, i.e. onto the `wrangler pages deploy …` invocation.
      - name: Build and deploy to Cloudflare Pages
        run: npm run pages:deploy -- --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # Prove the public Supabase config actually embedded in the built bundle (Vite inlines
      # the URL as a string literal). Catches a missing/empty variable that would otherwise
      # ship `undefined` and fail only in the user's browser.
      - name: Verify Supabase config baked into the bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          grep -rqF "$VITE_SUPABASE_URL" dist/assets \
            || { echo "::error::Built bundle does not contain VITE_SUPABASE_URL — env not embedded at build time."; exit 1; }

      # Prove *this commit* became the production (canonical) deployment by matching the
      # SHA we tagged the upload with — not a freshness heuristic (a concurrent/manual
      # deploy could be fresh too). Retries absorb canonical-flip propagation; --fail-with-body
      # turns an auth/API error into a loud failure instead of feeding jq an error body.
      - name: Verify the canonical production deployment is this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/norcal-onboarding"
          for attempt in 1 2 3 4 5; do
            body=$(curl -s --fail-with-body --connect-timeout 5 --max-time 15 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api") || {
              echo "Attempt $attempt: API request failed: $body"; sleep 10; continue; }
            actual=$(echo "$body" | jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash')
            echo "Attempt $attempt: canonical commit_hash=$actual want=$GITHUB_SHA"
            if [ "$actual" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Canonical production deployment is not this commit ($GITHUB_SHA). Last: ${actual:-none}"
          exit 1

      # Availability check: the SPA shell is now public (auth is per-user via Supabase, not a
      # site-wide gate), so the site should answer 200. This confirms reachability; the
      # bundle-bake check above already proves the Supabase env embedded. Verifying the login
      # screen actually renders / Supabase initializes without error is a manual post-deploy
      # step (CI has no browser).
      - name: Verify the site is reachable (expects 200)
        run: |
          url="https://norcal-onboarding.pages.dev"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 15 "$url" || true)
            echo "Attempt $attempt: $url -> HTTP ${code:-000}"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Production site did not return 200. Last code: ${code:-000}"
          exit 1
